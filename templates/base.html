<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Streamline{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if session.user_id %}
    <!-- Netflix-Style Navigation Bar -->
    <nav class="netflix-navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="/" class="nav-logo">STREAMLINE</a>
                <div class="nav-primary">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                    <a href="/top_rated" class="nav-link {% if request.path == '/top_rated' %}active{% endif %}">Movies</a>
                    <a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}">Search</a>
                </div>
            </div>
            <div class="nav-right">
                <a href="/profile" class="nav-icon-btn" title="My Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </a>
                <div class="nav-profile">
                    <button class="profile-dropdown" id="profileBtn">
                        <span class="profile-icon">{{ session.username[0].upper() }}</span>
                        <svg class="dropdown-arrow" width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
                            <path d="M0 2l4 4 4-4z"/>
                        </svg>
                    </button>
                    <div class="profile-menu" id="profileMenu">
                        <a href="/profile" class="profile-menu-item">Manage Profiles</a>
                        <a href="/logout" class="profile-menu-item">Sign Out</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
// Global toggleWatchlist function for movie cards
function toggleWatchlist(movieTitle) {
    console.log('Toggling watchlist for:', movieTitle);
    
    fetch('/toggle_watchlist', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'movie_title=' + encodeURIComponent(movieTitle)
    })
    .then(response => {
        console.log('Response status:', response.status);
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        console.log('Response data:', data);
        if (data.success) {
            alert(data.message);
            // Update button appearance
            const btns = document.querySelectorAll(`[data-movie-title="${movieTitle}"] .watchlist-icon`);
            btns.forEach(btn => {
                if (data.action === 'added') {
                    btn.style.fill = 'currentColor';
                    btn.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                } else {
                    btn.style.fill = 'none';
                    btn.innerHTML = '<path d="M12 5v14M5 12h14"/>';
                }
            });
        } else {
            alert(data.error || 'Operation failed');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to update watchlist. Please check console for details.');
    });
}
</script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
