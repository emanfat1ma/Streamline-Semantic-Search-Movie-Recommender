{# Netflix-Style Movie Card Macro - SIMPLIFIED VERSION #}
{% macro movie_card(movie, card_type='netflix') %}
    <div class="netflix-card" data-movie-title="{{ movie.title }}" data-movie-id="{{ movie.id }}">
        <div class="card-image-wrapper">
            <img src="{{ movie.poster_url if movie.poster_url else 'https://via.placeholder.com/300x450?text=No+Image' }}" 
                 alt="{{ movie.title }}" 
                 class="card-image"
                 loading="lazy"
                 onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
            <div class="card-overlay">
                <div class="card-info">
                    <h3 class="card-title">{{ movie.title }}</h3>
                    <p class="card-description">{{ movie.overview[:100] if movie.overview else "No description available" }}...</p>
                </div>
                <div class="card-actions">
                    <button class="card-action-btn play-btn" title="Play">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
    
                    <!-- Watchlist Toggle Button - SIMPLIFIED -->
                    <!-- SIMPLEST FIX - No complex escaping -->
                    <button class="card-action-btn watchlist-btn" 
                        title="Add to My List"
                        onclick="toggleWatchlist({{ movie.title|tojson }})">
                        <svg class="watchlist-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
    
                    <button class="card-action-btn info-btn" 
                            title="{{ movie.overview }}"
                            data-overview="{{ movie.overview | e }}">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                    </button>

                    <button class="card-action-btn like-btn"
                            title="Like"
                            onclick="toggleLike(this, 123)">
                        <svg class="like-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                        </svg>
                    </button>

                </div>
                <div class="card-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-badges">
            <span class="badge-hd">HD</span>
        </div>
    </div>
{% endmacro %}
